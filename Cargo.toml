[package]
name = "kickbacks-kit"
version = "0.3.2"
edition = "2021"
rust-version = "1.80"
description = "Phase 0 command-center tools for Kickback.ai surfaces: archive local observations, inspect trust state, and keep earning candidates behind official opt-in adapters."
authors = ["Ahmad Othman Ammar Adi"]
license = "MIT"
repository = "https://github.com/OthmanAdi/kickbacks-kit"
homepage = "https://github.com/OthmanAdi/kickbacks-kit"
keywords = ["kickbacks", "tui", "ratatui", "claude-code", "ads"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "kb"
path = "src/main.rs"

[[bin]]
name = "kickbacks"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
dirs = "5.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
